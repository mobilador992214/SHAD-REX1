name: Build SHADORE APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build APK
    run: |
      PROJECT_DIR="$(find . -name gradlew -type f -print -quit | xargs -r dirname)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: File gradlew tidak ditemukan."
        exit 1
      fi

      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SHADORE-debug-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
```
